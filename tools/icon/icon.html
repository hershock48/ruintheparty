<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:BC;src:url(bc800.woff2) format("woff2");font-weight:800}
html,body{margin:0;background:transparent}
.c{width:1024px;height:1024px;position:relative;overflow:hidden}
svg{display:block}
</style>
<!-- The #R roundel from the client's boards, redrawn as vector so it cuts
     clean at every size: black disc, white ring, teal hash slanted like
     the brush mark, white R in Barlow Condensed 800 with the same slant,
     the R riding over the hash's right upright as it does on the boards.
     ?small=1 renders the 16/32 version: no ring, full-bleed black square,
     the two glyphs filling it. -->
<div class="c" id="c">
<svg id="svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="hash">
      <rect x="-150" y="-210" width="100" height="420" rx="16"/>
      <rect x="  40" y="-210" width="100" height="420" rx="16"/>
      <rect x="-260" y="-110" width="500" height="96" rx="16"/>
      <rect x="-260" y="  40" width="500" height="96" rx="16"/>
    </g>
  </defs>
  <g id="big">
    <circle cx="512" cy="512" r="500" fill="#fff"/>
    <circle cx="512" cy="512" r="446" fill="#000"/>
    <g transform="translate(372 522) skewX(-14) scale(0.92)" fill="#00DFDF"><use href="#hash"/></g>
    <text x="0" y="0" font-family="BC" font-weight="800" font-size="600" fill="#fff" transform="translate(690 740) skewX(-10)" text-anchor="middle">R</text>
  </g>
  <g id="small" display="none">
    <rect width="1024" height="1024" rx="160" fill="#000"/>
    <g transform="translate(330 512) skewX(-12) scale(1.12)" fill="#00DFDF"><use href="#hash"/></g>
    <text x="0" y="0" font-family="BC" font-weight="800" font-size="760" fill="#fff" stroke="#fff" stroke-width="30" transform="translate(735 800) skewX(-8)" text-anchor="middle">R</text>
  </g>
</svg>
</div>
<script>
if (location.search.includes("small")) { document.getElementById("big").setAttribute("display","none"); document.getElementById("small").removeAttribute("display"); }
</script>
